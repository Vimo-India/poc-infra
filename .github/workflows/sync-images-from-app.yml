name: Sync Images From App

on:
  repository_dispatch:
    types:
      - sync-infra-images
  workflow_dispatch:
    inputs:
      app_name:
        description: Application identifier to update in images.json
        required: true
        type: string
      image:
        description: Full image reference to record
        required: true
        type: string
      source_sha:
        description: Source application commit SHA
        required: true
        type: string
      source_branch:
        description: Source application branch name
        required: true
        type: string
      target_branch:
        description: Optional explicit target infra branch override
        required: false
        default: ""
        type: string
      channel:
        description: Optional explicit channel override (alpha, story, release)
        required: false
        default: ""
        type: string
      images_file:
        description: Path to images metadata file
        required: false
        default: images.json
        type: string
      source_trigger_actor:
        description: GitHub actor that triggered the source workflow run
        required: false
        default: ""
        type: string
      source_commit_author:
        description: Author identity from source commit event payload
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: infra-images-sync-${{ github.event.client_payload.target_branch || inputs.target_branch || github.event.client_payload.source_branch || inputs.source_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    name: Resolve Sync Route
    runs-on: generic
    outputs:
      should_sync: ${{ steps.route.outputs.should_sync }}
      target_branch: ${{ steps.route.outputs.target_branch }}
      channel: ${{ steps.route.outputs.channel }}
      app_name: ${{ steps.route.outputs.app_name }}
      image: ${{ steps.route.outputs.image }}
      source_sha: ${{ steps.route.outputs.source_sha }}
      source_branch: ${{ steps.route.outputs.source_branch }}
      source_trigger_actor: ${{ steps.route.outputs.source_trigger_actor }}
      source_commit_author: ${{ steps.route.outputs.source_commit_author }}
      images_file: ${{ steps.route.outputs.images_file }}
    steps:
      - name: Resolve request payload
        id: route
        shell: bash
        env:
          APP_NAME: ${{ github.event.client_payload.app_name || inputs.app_name }}
          IMAGE: ${{ github.event.client_payload.image || inputs.image }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha || inputs.source_sha }}
          SOURCE_BRANCH: ${{ github.event.client_payload.source_branch || inputs.source_branch }}
          TARGET_BRANCH_INPUT: ${{ github.event.client_payload.target_branch || inputs.target_branch }}
          CHANNEL_INPUT: ${{ github.event.client_payload.channel || inputs.channel }}
          IMAGES_FILE: ${{ github.event.client_payload.images_file || inputs.images_file || 'images.json' }}
          SOURCE_TRIGGER_ACTOR: ${{ github.event.client_payload.source_trigger_actor || inputs.source_trigger_actor }}
          SOURCE_COMMIT_AUTHOR: ${{ github.event.client_payload.source_commit_author || inputs.source_commit_author }}
        run: |
          set -euo pipefail

          if [[ -z "${APP_NAME}" || -z "${IMAGE}" || -z "${SOURCE_SHA}" || -z "${SOURCE_BRANCH}" ]]; then
            echo "app_name, image, source_sha, and source_branch are required" >&2
            exit 1
          fi

          target_branch="${TARGET_BRANCH_INPUT}"
          channel="${CHANNEL_INPUT}"

          if [[ -z "${target_branch}" || -z "${channel}" ]]; then
            if [[ "${SOURCE_BRANCH}" == "main" ]]; then
              target_branch="main"
              channel="alpha"
            elif [[ "${SOURCE_BRANCH}" == story/* ]]; then
              target_branch="${SOURCE_BRANCH}"
              channel="story"
            elif [[ "${SOURCE_BRANCH}" == release/* ]]; then
              if [[ ! "${SOURCE_BRANCH}" =~ ^release/[0-9]{2}\.[0-9]{2}$ ]]; then
                echo "Release branches must follow release/YY.MM naming. Got: ${SOURCE_BRANCH}" >&2
                exit 1
              fi
              target_branch="${SOURCE_BRANCH}"
              channel="release"
            else
              target_branch=""
              channel="none"
            fi
          fi

          if [[ "${channel}" == "none" || -z "${target_branch}" ]]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "target_branch=" >> "$GITHUB_OUTPUT"
            echo "channel=none" >> "$GITHUB_OUTPUT"
          else
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "target_branch=${target_branch}" >> "$GITHUB_OUTPUT"
            echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          fi

          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_branch=${SOURCE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "source_trigger_actor=${SOURCE_TRIGGER_ACTOR}" >> "$GITHUB_OUTPUT"
          echo "source_commit_author=${SOURCE_COMMIT_AUTHOR}" >> "$GITHUB_OUTPUT"
          echo "images_file=${IMAGES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Skip unsupported branch type
        if: ${{ steps.route.outputs.should_sync != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "[infra-sync] skipping images sync for source branch '${{ steps.route.outputs.source_branch }}'"
          echo "[infra-sync] supported branches are main, story/*, and release/YY.MM"

  sync-non-release:
    name: Sync Images Metadata
    needs: route
    if: ${{ needs.route.outputs.should_sync == 'true' && needs.route.outputs.channel != 'release' }}
    runs-on: generic
    steps:
      - name: Update images.json
        uses: Vimo-India/shared-workflows/.github/actions/sync-infra-images@main
        with:
          infra_repo: ${{ github.repository }}
          infra_repo_token: ${{ github.token }}
          target_branch: ${{ needs.route.outputs.target_branch }}
          images_file: ${{ needs.route.outputs.images_file }}
          app_name: ${{ needs.route.outputs.app_name }}
          image: ${{ needs.route.outputs.image }}
          source_sha: ${{ needs.route.outputs.source_sha }}
          source_branch: ${{ needs.route.outputs.source_branch }}
          source_trigger_actor: ${{ needs.route.outputs.source_trigger_actor }}
          source_commit_author: ${{ needs.route.outputs.source_commit_author }}

  sync-release-approved:
    name: Sync Release Images Metadata
    needs: route
    if: ${{ needs.route.outputs.should_sync == 'true' && needs.route.outputs.channel == 'release' }}
    runs-on: generic
    environment:
      name: release-images-sync
    steps:
      - name: Update images.json after approval
        uses: Vimo-India/shared-workflows/.github/actions/sync-infra-images@main
        with:
          infra_repo: ${{ github.repository }}
          infra_repo_token: ${{ github.token }}
          target_branch: ${{ needs.route.outputs.target_branch }}
          images_file: ${{ needs.route.outputs.images_file }}
          app_name: ${{ needs.route.outputs.app_name }}
          image: ${{ needs.route.outputs.image }}
          source_sha: ${{ needs.route.outputs.source_sha }}
          source_branch: ${{ needs.route.outputs.source_branch }}
          source_trigger_actor: ${{ needs.route.outputs.source_trigger_actor }}
          source_commit_author: ${{ needs.route.outputs.source_commit_author }}
